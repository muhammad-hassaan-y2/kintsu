name: CI/CD Build & Deployment Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Push Author
        run: |
          echo "Pushed by: ${{ github.actor }}"
          echo "Event name: ${{ github.event_name }}"
          if [ "${{ github.actor }}" != "muhammad-hassaan-y2" ]; then
            echo "Notice: Push detected from contributor or external user '${{ github.actor }}'. Triggering verification..."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Build
        run: npm run build
